[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openharness-enterprise"
version = "0.1.0"
description = "OpenHarness Enterprise - Multi-user enterprise version"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Your Organization" },
]

dependencies = [
    # 原有 OpenHarness 依赖
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "textual>=0.80.0",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "mcp>=1.0.0",
    "pyperclip>=1.9.0",
    "pyyaml>=6.0",
    "questionary>=2.0.1",
    "watchfiles>=0.20.0",
    "croniter>=2.0.0",
    # Enterprise 新增依赖
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "python-jose[cryptography]>=3.3.0",  # JWT
    "passlib[bcrypt]>=1.7.4",            # 密码哈希
    "python-multipart>=0.0.9",           # 表单处理
    "aiosqlite>=0.19.0",                 # 异步 SQLite
    "sse-starlette>=2.0.0",              # A2A SSE 流式响应
    "paramiko>=3.0.0",                   # SSH 远程管理
]

[project.optional-dependencies]
dev = [
    "pexpect>=4.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",  # 测试 HTTP 客户端
]

[project.scripts]
oh-enterprise = "openharness.enterprise.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true